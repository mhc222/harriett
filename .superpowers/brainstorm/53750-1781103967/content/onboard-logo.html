<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harriett Onboarding</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1C1814;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .shell {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Logo */
  .logo {
    font-size: 28px;
    font-weight: 600;
    color: #F5F0E8;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .logo span { color: #B91C1C; }

  /* Tagline */
  .tagline {
    font-size: 11px;
    color: #6B5E52;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* Progress bar — UNDER logo */
  .progress-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 32px;
  }
  .progress-step {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: #3C3530;
    transition: background 0.3s;
  }
  .progress-step.active { background: #B91C1C; }
  .progress-step.done { background: #6B5E52; }

  /* Card */
  .card {
    background: #F5F0E8;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
  }
  .card-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #B91C1C;
    margin-bottom: 10px;
  }
  .card-heading {
    font-size: 20px;
    font-weight: 700;
    color: #1C1814;
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .card-sub {
    font-size: 13px;
    color: #6B5E52;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .field input {
    background: #fff;
    border: 1px solid #E8E2D8;
    border-radius: 10px;
    padding: 12px 16px;
    font-family: Georgia, serif;
    font-size: 14px;
    color: #1C1814;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: #1C1814; }
  .field input::placeholder { color: #B8B0A6; }
  .actions {
    display: flex;
    justify-content: flex-end;
  }
  .btn-primary {
    background: #1C1814;
    color: #F5F0E8;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-family: Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="shell">

  <div class="logo">Harriett<span>.</span></div>
  <div class="tagline">Pritchett-Moore Real Estate</div>

  <!-- Progress bar UNDER logo -->
  <div class="progress-wrap">
    <div class="progress-step active"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
    <div class="progress-step"></div>
  </div>

  <div class="card">
    <p class="card-eyebrow">Step 1 of 4</p>
    <h2 class="card-heading">Before we get started, I need to know who I'm working with.</h2>
    <p class="card-sub">I'll use your name and your signature in every message I draft. It'll sound like you — not like software.</p>
    <div class="field">
      <input type="text" placeholder="Your full name" value="Tanner Ashcraft" />
      <input type="text" placeholder="How you sign off (e.g. T-Money, Tanner)" />
    </div>
    <div class="actions">
      <button class="btn-primary">Let's go &rarr;</button>
    </div>
  </div>

</div>
</body>
</html>
